<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0f0b08"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../icon-180.png"><link rel="icon" type="image/png" href="../icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="&#xb3d9;&#xbc29;&#xc804;&#xae30;"><title>&#xb3d9;&#xbc29;&#xc804;&#xae30;</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap"><style>:root{
  --ink:#f4ead2;--muted:#bba98a;--dim:#8a7b64;--gold:#d9b25f;--gold2:#f3d68a;--red:#b23a2e;--teal:#2f7a72;--blue:#3f86d8;
  --panel:rgba(26,19,14,.94);--panel2:rgba(40,29,21,.96);--line:#6a5236;--line2:#a7834a;
  --hp:#d8453a;--mp:#3f86d8;--xp:#e0b640;
  --ff:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --fs:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0f0b08;color:var(--ink);font-family:var(--ff);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;overflow:hidden;background:#0f0b08}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
button{font-family:var(--ff);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));width:min(268px,58vw);display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
.me{display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(40,29,21,.92),rgba(22,16,12,.92));border:1px solid var(--line2);border-radius:8px;padding:6px 8px;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,230,170,.08);pointer-events:auto}
.face{width:40px;height:40px;flex:none;border:1px solid var(--line2);border-radius:6px;background:#1b140f;image-rendering:pixelated;overflow:hidden;display:grid;place-items:center}
.face canvas{width:36px;height:48px;image-rendering:pixelated;margin-top:6px}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--gold2);font-weight:700;margin-left:4px}
.bar{position:relative;height:11px;background:#140e0a;border:1px solid #4a3a28;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;transition:width .15s}
.bar span{position:absolute;inset:0;font-size:9px;line-height:10px;text-align:center;font-weight:800;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.bar.hp i{background:linear-gradient(180deg,#f06a5a,#b82e24)}
.bar.mp i{background:linear-gradient(180deg,#6fb0ff,#2a64b8)}
.bar.xp{height:10px}.bar.xp i{background:linear-gradient(180deg,#ffe07a,#c79a2a)}.bar.xp span{font-size:8px;line-height:9px;color:#fff6d8}
#party{display:flex;flex-direction:column;gap:3px}
.pm{display:flex;align-items:center;gap:6px;background:rgba(22,16,12,.85);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:10px;font-weight:700}
.pm .bar{flex:1;height:7px}
.pm.down{opacity:.55}
#buffs{display:flex;gap:4px;flex-wrap:wrap}
.buff{font-size:10px;background:rgba(22,16,12,.85);border:1px solid var(--line);border-radius:10px;padding:1px 6px;font-weight:700;font-variant-numeric:tabular-nums}
#tracker{background:rgba(22,16,12,.5);text-shadow:0 1px 2px #000,0 0 3px #000;border-left:3px solid var(--gold);border-radius:4px;padding:6px 8px;font-size:11px;line-height:1.45;pointer-events:auto}
#tracker b{color:var(--gold2);display:block;font-size:11px}
#tracker .req{color:#9fd8ff;margin-top:3px}

#topr{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:5}
.gold{background:rgba(22,16,12,.9);border:1px solid var(--line2);border-radius:14px;padding:4px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.gold b{color:var(--gold2)}
#mini{width:132px;height:100px;border:1px solid var(--line2);border-radius:6px;background:#0f0b08;image-rendering:pixelated;cursor:pointer}
#mini.small{width:66px;height:50px}
#menuBtns{display:grid;grid-template-columns:repeat(4,32px);gap:4px}
.mb{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:linear-gradient(180deg,#3a2a1d,#1e1610);font-size:15px;position:relative;padding:0;box-shadow:0 2px 0 #000}
.mb .dot{position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#ff5a3d;border:1px solid #000;display:none}
.mb.alert .dot{display:block}
.key{position:absolute;right:2px;bottom:1px;font-size:8px;color:var(--muted);font-weight:800;display:none}
.pc .key{display:block}

#banner{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;z-index:4}
#banner .t{font-family:var(--fs);font-size:22px;font-weight:700;color:var(--gold2);text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);letter-spacing:2px;white-space:nowrap}
#banner .s{font-size:11px;color:var(--ink);text-shadow:0 1px 2px #000;margin-top:2px}
#banner.show{opacity:1}
#bossbar{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 54px);transform:translateX(-50%);width:min(420px,70vw);display:none;z-index:4;pointer-events:none;text-align:center}
#bossbar .bn{font-weight:900;font-size:13px;text-shadow:0 1px 2px #000;color:#ffe2a6}
#bossbar .bn small{color:#ffb38a;font-weight:700;margin-left:6px}
#bossbar .bb{height:12px;border:1px solid #d9b25f;background:#200c08;border-radius:3px;overflow:hidden;margin-top:3px}
#bossbar .bb i{display:block;height:100%;background:linear-gradient(180deg,#ff6a4a,#a3201a);transition:width .15s}
#toasts{position:absolute;left:50%;top:max(150px,26vh);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:30;width:min(92vw,520px)}
.toast{background:rgba(18,13,10,.93);border:1px solid var(--line2);border-radius:18px;padding:6px 14px;font-size:12px;font-weight:700;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.5);animation:tin .25s ease-out}
.toast.gold{border-color:#e7c46a;color:#ffe7a6}.toast.red{border-color:#d0584a;color:#ffc4b8}.toast.blue{border-color:#5f9fd8;color:#cfe6ff}.toast.purple{border-color:#b27ae8;color:#ecd8ff}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}

#chat{position:absolute;left:max(8px,env(safe-area-inset-left));bottom:calc(172px + env(safe-area-inset-bottom));width:min(330px,56vw);max-height:92px;overflow:hidden;font-size:10.5px;line-height:1.45;pointer-events:none;z-index:3;text-shadow:0 1px 1px #000,0 0 3px #000;display:flex;flex-direction:column;justify-content:flex-end}
#chat .c{opacity:.92}#chat .who{color:#9fd8ff;font-weight:800}#chat .sys{color:var(--gold2)}
.pc #chat{bottom:calc(16px + env(safe-area-inset-bottom))}

/* ---------- touch controls ---------- */
#stick{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(40,30,22,.35),rgba(20,14,10,.55));border:2px solid rgba(217,178,95,.45);z-index:6;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d68a,#a7834a);border:2px solid #ffe7a6;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.pc #stick{display:none}
#actions{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));width:206px;height:206px;z-index:6;pointer-events:none}
#actions button{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid var(--line2);background:radial-gradient(circle at 40% 30%,#4a3524,#1d150f);box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,230,170,.15);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;overflow:hidden;touch-action:none}
#bAtk{right:6px;bottom:6px;width:74px;height:74px;font-size:12px;border-color:#e7a36a!important;background:radial-gradient(circle at 40% 30%,#b8432f,#5e1a12)!important}
#bAtk .ic{font-size:26px;line-height:1}
.sk{width:52px;height:52px;font-size:9px}
.sk .ic{font-size:19px;line-height:1.1}
.sk .nm2{max-width:48px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:900;text-shadow:0 1px 2px #000;pointer-events:none}
.sk.lock{filter:grayscale(1) brightness(.55)}
.sk.nomp{box-shadow:inset 0 0 0 3px rgba(63,134,216,.7)!important}
#s0{right:88px;bottom:2px}#s1{right:96px;bottom:64px}#s2{right:70px;bottom:118px}#s3{right:17px;bottom:86px}#s4{right:12px;bottom:144px}
#bHp,#bMp{width:40px;height:40px;font-size:15px}
#bHp{right:150px;bottom:132px}#bMp{right:104px;bottom:168px}
#bHp small,#bMp small{font-size:8px;font-variant-numeric:tabular-nums}
#bAuto{right:156px;bottom:0;width:44px;height:44px;font-size:10px}
#bAuto.on{border-color:#7fe0a0!important;background:radial-gradient(circle at 40% 30%,#2f7a52,#133524)!important;color:#dfffe9}
#bTalk{right:160px;bottom:60px;width:50px;height:50px;font-size:11px;display:none!important;border-color:#f3d68a!important;background:radial-gradient(circle at 40% 30%,#8a6a2a,#3a2a10)!important;animation:pulse 1.2s infinite}
#bTalk.show{display:flex!important}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(243,214,138,.25),0 3px 0 #000}}
#actions .key{right:50%;transform:translateX(50%);bottom:2px}

/* ---------- windows ---------- */
#modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,3,2,.55);padding:12px}
#modal[hidden]{display:none}
.win{width:min(560px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;background:linear-gradient(180deg,#2c2017,#1a130e);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,230,170,.1);overflow:hidden}
.wh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#3a2a1d,#241a12)}
.wh b{flex:1;font-family:var(--fs);font-size:17px;color:var(--gold2);letter-spacing:1px}
.wh button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line2);background:#1d150f;font-size:14px}
.wb{padding:12px;overflow:auto;font-size:13px;line-height:1.55;overscroll-behavior:contain;touch-action:pan-y}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tab{flex:1;min-width:64px;padding:7px 4px;border-radius:6px;border:1px solid var(--line);background:#211811;font-size:12px;font-weight:700}
.tab.on{background:linear-gradient(180deg,#6a4a24,#3a2812);border-color:var(--gold);color:var(--gold2)}
.row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:7px;background:rgba(255,240,210,.03);margin-bottom:6px}
.row .ic{font-size:22px;width:30px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx .t1{font-weight:800;font-size:13px}
.row .tx .t2{font-size:11px;color:var(--muted)}
.row .tx .t3{font-size:11px;color:#9fd8ff}
.row .pr{font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.btn{padding:8px 12px;border-radius:7px;border:1px solid var(--line2);background:linear-gradient(180deg,#5a3f22,#342412);font-weight:800;font-size:12px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.red{background:linear-gradient(180deg,#8a2f24,#4a1812);border-color:#d0584a}
.btn.teal{background:linear-gradient(180deg,#2f6f6a,#153a36);border-color:#5fb0a6}
.btn.big{width:100%;padding:11px;font-size:14px;margin-top:6px}
.say{background:#120d09;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.say .who{color:var(--gold2);font-weight:800;font-size:12px;display:block;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.slot{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#140e0a;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;padding:0}
.slot .n{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:800;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.slot .pl{position:absolute;left:3px;top:1px;font-size:9px;font-weight:900;color:var(--gold2);text-shadow:0 1px 1px #000}
.slot.sel{outline:2px solid var(--gold2)}
.slot.empty{opacity:.35;font-size:10px;color:var(--muted)}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.eqs{border:1px solid var(--line);border-radius:7px;background:#140e0a;padding:6px;min-height:62px;font-size:10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.eqs .ic{font-size:20px}.eqs .l{color:var(--dim);font-size:9px}
.detail{border:1px solid var(--line2);border-radius:8px;background:#120d09;padding:10px;margin-top:8px}
.detail .nm3{font-weight:900;font-size:14px}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;border-bottom:1px dashed rgba(167,131,74,.2)}
.stat b{font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.opt{color:#9fd8ff;font-size:12px}
.up{color:#7fe09a}.down{color:#ff8a7a}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.job{border:1px solid var(--line2);border-radius:8px;background:#1a130e;padding:10px;text-align:left}
.job b{color:var(--gold2);font-size:15px;font-family:var(--fs)}
.job p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.4}
.pill{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:10px;padding:0 6px;margin:1px 2px 1px 0;color:var(--muted)}
.muted{color:var(--muted);font-size:12px}
.sep{height:1px;background:var(--line);margin:10px 0}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity .25s}

/* ---------- title screen ---------- */
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,rgba(30,22,15,.35),rgba(8,5,3,.85));padding:20px;text-align:center}
#title[hidden]{display:none}
#title h1{margin:0;font-family:var(--fs);font-size:clamp(44px,12vw,86px);color:var(--gold2);letter-spacing:8px;text-shadow:0 4px 0 #3a2410,0 0 30px rgba(243,214,138,.25);line-height:1}
#title .sub{font-size:13px;color:var(--ink);letter-spacing:6px;margin-top:-6px;opacity:.85}
#title .box{display:flex;flex-direction:column;gap:8px;width:min(300px,86vw)}
#title input{padding:11px;border-radius:8px;border:1px solid var(--line2);background:#140e0a;color:var(--ink);font-size:15px;text-align:center;font-family:var(--ff)}
#title .hint{font-size:11px;color:var(--muted);line-height:1.6}
@media (max-width:420px){ #actions{transform:scale(.92);transform-origin:right bottom} #stick{transform:scale(.92);transform-origin:left bottom} #menuBtns{grid-template-columns:repeat(4,30px)} .mb{width:30px;height:30px;font-size:14px} #mini{width:104px;height:78px} }
@media (max-height:520px){ #chat{display:none} #tracker{display:none} #mini{width:96px;height:72px} }
@media (prefers-reduced-motion:reduce){ .toast{animation:none} #bTalk{animation:none} }

.intitle #hud,.intitle #topr,.intitle #actions,.intitle #stick,.intitle #chat,.intitle #banner,.intitle #bossbar{display:none!important}

#menuToggle{display:none}
@media (max-width:700px){
  #menuToggle{display:block}
  #menuBtns{display:none;position:absolute;right:0;top:calc(100% + 6px);background:rgba(22,16,12,.96);border:1px solid var(--line2);border-radius:10px;padding:6px;grid-template-columns:repeat(4,40px)!important;gap:6px}
  #menuBtns.open{display:grid}
  #menuBtns .mb{width:40px;height:40px;font-size:18px}
  #topr{flex-direction:row;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end;width:min(170px,40vw);position:absolute}
  #topr .gold{order:0}
  #mini{width:100px;height:76px;order:2}
  #menuToggle{order:1;width:36px;height:36px;font-size:18px}
  #banner{top:24vh}
  #banner .t{font-size:20px}
  #toasts{top:34vh}
  #hud #bossbar{position:static;transform:none;width:auto;text-align:left;margin:0}
  #hud #bossbar .bn{font-size:11px}
  .bossfight #tracker{display:none}
}

/* ---------- v110: center announcements, boss result, extras ---------- */
#center{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:40;opacity:0;width:min(94vw,640px)}
#center.show{opacity:1}
#center.anim{animation:cpop 2.6s ease-out forwards}
#center .t{font-family:var(--fs);font-size:clamp(22px,5.4vw,36px);font-weight:700;color:#fff2c8;letter-spacing:1px;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.9)}
#center .s{font-size:clamp(13px,3.4vw,18px);font-weight:800;color:#ffe9a8;margin-top:6px;text-shadow:0 2px 3px #000}
#center.legend .t{color:#ffd24a;text-shadow:0 3px 0 #3a2400,0 0 24px rgba(255,200,60,.9)}
#center.unique .t{color:#ff6b5a;text-shadow:0 3px 0 #3a0800,0 0 26px rgba(255,90,50,.95),0 0 60px rgba(255,210,74,.6)}
#center.boss .t{color:#ff8a6a;text-shadow:0 3px 0 #300,0 0 20px rgba(255,40,20,.9)}
#center.boss .s{font-size:clamp(20px,5vw,30px);font-family:var(--fs);color:#fff;letter-spacing:4px}
#center.enh .t{color:#fff6d0;text-shadow:0 3px 0 #000,0 0 24px rgba(255,230,140,1)}
#center.fail .t{color:#b8b8c8;text-shadow:0 3px 0 #000}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}8%{transform:translate(-50%,-50%) scale(1.18);opacity:1}14%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
#result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;width:min(88vw,360px);background:linear-gradient(180deg,rgba(48,30,16,.97),rgba(20,13,8,.97));border:2px solid #d9b25f;border-radius:12px;padding:16px 16px 12px;text-align:center;box-shadow:0 0 0 1px #000,0 10px 40px rgba(0,0,0,.7),0 0 40px rgba(255,200,80,.25)}
#result[hidden]{display:none}
#result.pop{animation:rpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes rpop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#result .rt{font-family:var(--fs);font-size:20px;color:#ffe38a;font-weight:700}
#result .rtime{font-size:40px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:4px 0}
#result .rec{color:#ffd24a;font-weight:900;animation:blink 1s infinite}
#result .rsub{color:var(--muted);font-size:12px}
#result .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
#result .rgrid div{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:6px}
#result .rgrid span{display:block;font-size:10px;color:var(--muted)}
